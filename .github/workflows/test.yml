name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navcore:
    name: NavCore unit tests
    # macOS, because the app ships on Apple platforms and NavCore's Foundation must behave the same there.
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Packages/NavCore
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test

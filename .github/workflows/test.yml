name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navcore:
    name: NavCore unit tests
    # macOS, because the app ships on Apple platforms and NavCore's Foundation must behave the same there.
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Packages/NavCore
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Run tests
        run: swift test

  app:
    name: Build the iOS app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Xcode version
        run: xcodebuild -version
      # A Simulator build needs no signing team, so it runs without secrets.
      - name: Build for the iOS Simulator
        run: >
          xcodebuild build
          -project Jalan.xcodeproj
          -scheme Jalan
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -quiet
          CODE_SIGNING_ALLOWED=NO
